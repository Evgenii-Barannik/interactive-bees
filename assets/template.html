<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
</head>

<body class="main-container">
    <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <img src="assets/beelogo.png" alt="Bee Logo" style="width: 40px; height: 40px;">
        <h3 class="title">
            Beehive data
        </h3>
    </div>

    <div id="update_mode_control">
	<label>
            <input type="checkbox" id="continuous_update">
            Enable continuous acoustic spectra updates
        </label>
    </div>

    <div class="toggle-container">
        <label>
            <input type="checkbox" id="layoutToggle">
	    Use two column layout
        </label>
    </div>

    <div class="audio-controls-container">
	<br>Play sound for shown acoustic spectrum:<br>
	<select id="audioSensorSelector">	
	    {% for sensor in sensors %}
	    <option value="{{sensor}}">Sensor {{sensor}}</option>
	    {% endfor %}
	</select>
	<button id="playSpectrumButton" class="play-button">Play</button>
	<button id="stopButton" class="play-button">Stop</button>
        <div id="audioDebugInfo" style="white-space: pre-line;"></div>
    </div>

    <div class="row">
   <!-- -->
      <div class="column">
	    <div id="acoustic_spectra_plot", class="plotly-container">
		{{acoustic_spectra_plot}}
	   </div>
      </div>

      <div class="column">
	    <div id="time_slider_plot", class="plotly-container">
		{{time_slider_plot}}
	   </div>
      </div>
   <!-- -->
   </div>

    <div class="row">
    <!-- -->
      <div class="column">
	  <div style="display: flex; justify-content: space-between; align-items: center; margin-left: 60px">
	      <div class="title">Fit</div>
	      <div style="display: flex; gap: 10px; margin-right: 20px;">
		  <select id="gaussImageSelector" style="width: 100px;">
		      {% for sensor in sensors %}
		      <option value="{{image_paths[sensor]['gauss_averaged']}}">Sensor {{sensor}}</option>
		      {% endfor %}
		  </select>
		  <select id="gaussDatetimeSelector" style="width: 165px;">
		      <option value="averaged">Averaged</option>
		      <!-- Individual datetime options will be populated by JavaScript -->
		  </select>
	      </div>
	  </div>
	  <img id="displayedGaussImage" class="image-container" src="{{image_paths[sensors[0]]['gauss_averaged']}}" alt="Gaussian fit">
      </div>

      <div class="column">
	  <div style="display: flex; justify-content: space-between; align-items: center; margin-left: 60px">
	      <div class="title">Fit evolution</div>
	      <select id="evolutionImageSelector" style="width: 100px; margin-right: 20px;">
		  {% for sensor in sensors %}
		  <option value="{{image_paths[sensor]['evolution']}}">Sensor {{sensor}}</option>
		  {% endfor %}
	      </select>
	  </div>
	  <img id="displayedEvolutionImage" class="image-container" src="{{image_paths[sensors[0]]['evolution']}}" alt="Evolution">
      </div>
   <!-- -->
   </div>

    <div class="row">
    <!-- -->
      <div class="column">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-left: 60px">
            <div class="title">Acoustic similarity</div>
            <select id="imageSelector" style="width: 100px; margin-right: 20px;">
                {% for sensor in sensors %}
                <option value="{{image_paths[sensor]['similarity']}}">Sensor {{sensor}}</option>
                {% endfor %}
            </select>
        </div>
        <img id="displayedImage" class="image-container" src="{{image_paths[sensors[0]]['similarity']}}" alt="Similarity measures">
      </div>

      <div class="column">
      </div>
    <!-- -->
    </div>

    <!--<details>-->
    <!--    <summary>About Gaussian decomposition</summary>-->
    <!--    <pre style="white-space: pre-wrap">{{gauss_info}}</pre>-->
    <!--</details>-->
    <details>
	<summary>About acoustic spectra</summary>
	<pre style="white-space: pre-wrap">{{acoustic_spectra_info}}</pre>
    </details>
    <details>
        <summary>About acoustic similarity</summary>
        <pre style="white-space: pre-wrap">{{similarity_info}}</pre>
    </details>
    <details>
        <summary>About datapoints used</summary>
        <pre style="white-space: pre-wrap">{{datapoints_info}}</pre>
    </details>
    <script>
        // Pass image paths to JavaScript
        const imagePaths = JSON.parse('{{image_paths|tojson|safe}}');
    </script>
    <script src="{{OUTPUT_DIR}}/gauss_selectors.js?v={{version}}"></script>
    <script src="{{OUTPUT_DIR}}/spectra_callback.js?v={{version}}"></script>
    <script src="{{OUTPUT_DIR}}/playing_audio.js?v={{version}}"></script>
    <script>
        // Initialize Gaussian image paths after all scripts are loaded
        if (typeof initGaussImagePaths === 'function') {
            initGaussImagePaths(imagePaths);
            window.gaussSelectorsInitialized = true;
        }
    </script>
</body>
</html>
